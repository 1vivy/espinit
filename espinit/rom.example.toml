# espinit ROM configuration
#
# Deployed path: /debug_ramdisk/esp/espinit/roms/android-a.toml
# `generation` must equal the manifest generation. This file selects projected
# names and existing whole block-device backends; it does not define a new
# physical partition table, offsets, sizes, or implicit slot suffixes.
#
# Early failures use ESP /espinit/receipts/failure.json, not projected metadata.
# The ESP is normally RO; only failure replacement opens a bounded RW remount
# window: temporary file + fsync + atomic rename + directory fsync, then sync
# the ESP and remount RO. After successful projection, PID1 privately mounts
# projected metadata and installs espinitd/packages before Android handoff.

schema_version = 1
generation = "release-1"
id = "android-a"

# managed = true requires successful gpt.ko projection of the complete list
# below before Android handoff, with no stock-ROM fallback. managed = false
# requires the partitions array to be empty or absent and must not list a gpt
# module in the manifest.
managed = true

# Order is publication order, not priority or fallback. Names are unique at the
# Android partition surface, must not collide with a retained physical name or
# another projection, and are limited to 36 bytes: the gpt ABI label size.
#
# Backends are resolved only when the ordered payload reaches the `gpt` entry,
# after every earlier module and its scripts have run, so a logical volume,
# mapper device, loop or ESP file those entries activate is visible. Each
# `backend` is one of four documented forms:
#
#   /dev/block/by-name/<physical-name>  exact, unique sysfs PARTNAME
#   /dev/mapper/<name>                  exact, unique /sys/class/block/dm-*/dm/name
#   /dev/loopN                          an existing loop device
#   esp-file:<relative-path>            preallocated regular file on the
#                                       already-mounted read-only ESP, attached
#                                       read-only by the loader with zero offset
#                                       and no size limit (writable is fatal)
#
# What an earlier module may do first, e.g. activate a thick or thin LV with
# `dmsetup`, is a module/script concern; the projection that follows only ever
# names the resulting block device. Each projection spans the entire backend;
# whole-LU devices, offsets, size slicing, and any extent/FIEMAP ABI are not
# accepted. The ESP-file relative path is resolved from the ESP mount root,
# e.g. esp-file:espinit/backing.img, and the attachment stays alive through the
# projection. `read_only` explicitly selects projected access; physical
# residual exposure is read-only regardless of this value.

[[partitions]]
name = "super"
backend = "/dev/block/by-name/super_1"
read_only = false

[[partitions]]
name = "vbmeta_system"
backend = "/dev/block/by-name/vbmeta_system_1"
read_only = true

# A logical volume activated by an earlier ordered module or script.
[[partitions]]
name = "system"
backend = "/dev/mapper/lv-system"
read_only = true

# A preallocated image on the read-only ESP; only the read-only ESP-file form
# and `read_only = true` are accepted.
[[partitions]]
name = "vendor"
backend = "esp-file:espinit/backing/vendor.img"
read_only = true

# Platform staging requires writable projected metadata. Select the actual
# filesystem explicitly in manifest.platform.metadata_filesystem.
[[partitions]]
name = "metadata"
backend = "/dev/block/by-name/metadata"
read_only = false

# Normal boot HAL persistence: both are projected, never whole-LU access.
[[partitions]]
name = "bdsvars"
backend = "/dev/block/by-name/bdsvars"
read_only = false

[[partitions]]
name = "misc"
backend = "/dev/block/by-name/misc"
read_only = false
