[package]
name = "gobbl-boot-hal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace]
resolver = "3"

# The vendored generic-bootctl crates inherit these tables, so their manifests
# stay byte-identical to the pinned upstream commit (see PROVENANCE.md).
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
esu-platform = { path = "../../userspace/esu-platform" }
generic-bootctl-core = { path = "vendor/generic-bootctl/crates/core" }
generic-bootctl-aidl = { path = "vendor/generic-bootctl/crates/aidl" }

[[bin]]
name = "gobbl-boot-hal"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
