[package]
name = "gblbds-boot-hal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
build = "../../userspace/ksuinit/build.rs"

[workspace]

[dependencies]
varstore = { path = "varstore" }

[[bin]]
name = "gblbds-boot-hal"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
