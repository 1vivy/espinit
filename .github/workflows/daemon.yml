name: Build Magisk-derived Egysk userspace
on:
  workflow_call:
    inputs:
      abi:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Provision pinned upstream ONDK
        run: |
          mkdir -p "$ANDROID_HOME/ndk"
          python3 vendor/Magisk/build.py ndk
      - name: Materialize exact product patches
        run: python3 scripts/magisk.py materialize --init-dependencies
      - name: Build native daemon and policy tool
        run: python3 scripts/magisk.py build --ndk "$ANDROID_HOME/ndk/magisk" --abi '${{ inputs.abi }}'
      - name: Check source materialization remains exact
        run: python3 scripts/magisk.py materialize --check
      - uses: actions/upload-artifact@v7
        with:
          name: egysk-native-${{ inputs.abi }}
          path: out/native/${{ inputs.abi }}/bin/
          if-no-files-found: error
