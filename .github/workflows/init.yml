name: Build static ESP rdinit
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            arch: aarch64
          - target: x86_64-linux-android
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust target
        run: |
          rustup update stable
          rustup target add '${{ matrix.target }}'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - uses: Swatinem/rust-cache@v2
      - name: Build static rdinit
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh '${{ matrix.target }}' 26
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-${{ matrix.arch }}-android.a"
          test -f "$BUILTINS"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          cargo build --locked --package esuinit --target '${{ matrix.target }}' --release
          mkdir -p 'out/rdinit/${{ matrix.arch }}'
          cp 'target/${{ matrix.target }}/release/esuinit' 'out/rdinit/${{ matrix.arch }}/ksuinit'
      - uses: actions/upload-artifact@v7
        with:
          name: kernelsu-esp-rdinit-${{ matrix.arch }}
          path: out/rdinit/${{ matrix.arch }}/ksuinit
          if-no-files-found: error
