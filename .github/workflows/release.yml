name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Package native, rdinit and host components
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          count=0
          for artifact in egysk-native-* egysk-rdinit-* egysk-build-cpio-*; do
            test -d "$artifact"
            tar -C "$artifact" -czf "release/$artifact.tar.gz" .
            count=$((count + 1))
          done
          test "$count" -gt 0
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.tar.gz
          fail_on_unmatched_files: true
