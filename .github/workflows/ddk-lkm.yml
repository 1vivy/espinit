name: Exact DDK helper gate
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      generation:
        required: true
        type: number
      ddk_release:
        required: true
        type: string
      kmi_src:
        required: true
        type: string
      aarch64_out:
        required: true
        type: string
      x86_64_out:
        required: true
        type: string
      llvm_bin:
        required: true
        type: string
permissions:
  contents: read
jobs:
  helper:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.branch }}-${{ inputs.ddk_release }}
      # The container sees only the runner workspace plus these binds. ddk-min
      # ships its own source and a modules_prepare-only kdir (`ARCH=arm64`), so
      # the caller-supplied exact source and complete per-architecture outputs
      # are transferred by binding each absolute path at the identical container
      # path; nothing is copied or synthesized inside the container.
      volumes:
        - ${{ inputs.kmi_src }}:${{ inputs.kmi_src }}
        - ${{ inputs.aarch64_out }}:${{ inputs.aarch64_out }}
        - ${{ inputs.x86_64_out }}:${{ inputs.x86_64_out }}
        # clang resolves libc++ and other runtime libraries beside bin. Keep
        # llvm_bin as the caller interface, but bind its complete parent tree.
        - ${{ inputs.llvm_bin }}/..:${{ inputs.llvm_bin }}/..
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Admit the bound exact inputs for this architecture
        env:
          BRANCH: ${{ inputs.branch }}
          DDK_RELEASE: ${{ inputs.ddk_release }}
          KMI_SRC: ${{ inputs.kmi_src }}
          AARCH64_OUT: ${{ inputs.aarch64_out }}
          X86_64_OUT: ${{ inputs.x86_64_out }}
          LLVM_BIN: ${{ inputs.llvm_bin }}
          KMI_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # The image tag and the bind specifications are built from the same
          # values, so reject anything that either would have to reinterpret.
          case $BRANCH in
            *[!0-9a-z.-]*) echo "Not an exact ACK branch: $BRANCH" >&2; exit 2 ;;
          esac
          case $BRANCH in
            android[0-9]*-[0-9]*.[0-9]*) ;;
            *) echo "Not an exact ACK branch: $BRANCH" >&2; exit 2 ;;
          esac
          case $DDK_RELEASE in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "Not a dated DDK release: $DDK_RELEASE" >&2; exit 2 ;;
          esac
          for path in "$KMI_SRC" "$AARCH64_OUT" "$X86_64_OUT" "$LLVM_BIN"; do
            case $path in
              /*) ;;
              *) echo "Supplied path is not absolute, so its bind cannot transfer it: $path" >&2; exit 2 ;;
            esac
            case $path in
              *:*) echo "A supplied path containing ':' cannot be bound verbatim: $path" >&2; exit 2 ;;
            esac
          done
          if [ "$KMI_ARCH" = aarch64 ]; then KMI_OUT=$AARCH64_OUT; else KMI_OUT=$X86_64_OUT; fi
          test -s "$KMI_SRC/build.config.constants" || test -s "$KMI_SRC/build.config.common" \
            || test -s "$KMI_SRC/bazel/constants.scl" \
            || { echo "Missing prepared source identity under: $KMI_SRC" >&2; exit 2; }
          test -x "$LLVM_BIN/clang" || { echo "Missing matching compiler: $LLVM_BIN/clang" >&2; exit 2; }
          for input in Module.symvers System.map include/generated/utsrelease.h .config; do
            test -s "$KMI_OUT/$input" || { echo "Missing real kernel input: $KMI_OUT/$input" >&2; exit 2; }
          done
          {
            echo "KMI_SRC=$KMI_SRC"
            echo "KMI_OUT=$KMI_OUT"
          } >> "$GITHUB_ENV"
      - name: Build and verify against complete bound kernel outputs
        env:
          BRANCH: ${{ inputs.branch }}
          GENERATION: ${{ inputs.generation }}
          KMI_ARCH: ${{ matrix.arch }}
          LLVM_BIN: ${{ inputs.llvm_bin }}
        run: |
          set -eu
          # The container user differs from the checkout owner and the helper
          # records its git version, so trust the workspace as upstream does.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # ddk-min exports an arm64 CROSS_COMPILE, and kbuild turns its prefix
          # into `--target=`, which contradicts ARCH on the x86_64 leg. Clearing
          # it makes kbuild derive the target from ARCH (scripts/Makefile.clang),
          # which is the same aarch64-linux-gnu for arm64 and x86_64-linux-gnu
          # for x86_64.
          unset CROSS_COMPILE
          export PATH="$LLVM_BIN:$PATH"
          python3 scripts/kmi_modules.py build --module-dir kernel --module egysk \
            --branch "$BRANCH" --generation "$GENERATION" --arch "$KMI_ARCH" \
            --kmi-src "$KMI_SRC" --kmi-out "$KMI_OUT"
          output="release/$BRANCH-$GENERATION/$KMI_ARCH"
          mkdir -p "$output"
          install -m644 kernel/egysk.ko kernel/egysk.ko.compat.json "$output/"
          python3 scripts/kmi_modules.py verify --module "$output/egysk.ko" \
            --branch "$BRANCH" --generation "$GENERATION" --arch "$KMI_ARCH" --kmi-out "$KMI_OUT"
      - uses: actions/upload-artifact@v7
        with:
          name: egysk-ddk-${{ inputs.branch }}-${{ inputs.generation }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
