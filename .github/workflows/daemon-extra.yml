name: Build standalone host ksud
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Test host workspace
        run: cargo test --locked --workspace
      - name: Build archive CLI
        run: cargo build --locked --release --package esp-tools
      - name: Exercise CLI
        run: target/release/ksud --help
      - uses: actions/upload-artifact@v7
        with:
          name: ksud-host-x86_64-linux
          path: target/release/ksud
          if-no-files-found: error
