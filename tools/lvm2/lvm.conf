# Configuration the esu payload ships next to `esu/bin/lvm`; every invocation
# passes it explicitly with --config, so nothing here depends on the configured
# /dev/block/esd/etc confdir being readable. LVM requires options *after* the
# command: `lvm lvcreate ... --config "$(cat lvm.conf)"`.
devices {
    use_devicesfile = 0
    dir = "/dev/block/esd"
    scan = ["/dev/block/esd/pv"]
    filter = ["a|^/dev/block/esd/pv/a$|","r|.*|"]
}
activation {
    udev_rules = 0
    udev_sync = 0
    verify_udev_operations = 0
    monitoring = 0
}
global {
    use_lvmlockd = 0
}
