[package]
name = "cow-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "Device probe proving data-backed copy-on-write on a thin projected /data"

# Deliberately detached from the root workspace: this is a device-only
# diagnostic, never shipped in the ESP and never run by esu. The build
# mirrors payloads/boot-hal (own manifest, own lockfile, NDK Android target).
[workspace]

[dependencies]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
