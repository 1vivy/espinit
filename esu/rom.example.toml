# esu ROM configuration
#
# Deployed path: /debug_ramdisk/esp/esu/roms/android-a.toml
# This file selects projected names and existing whole block-device backends;
# it does not define a new physical partition table, offsets, sizes, or
# implicit slot suffixes. bdsvars BootedRom selects the file.
#
# Early failures use ESP /esu/receipts/failure.json, not projected metadata.
# The ESP is normally RO; only failure replacement opens a bounded RW remount
# window: temporary file + fsync + atomic rename + directory fsync, then sync
# the ESP and remount RO. There is no metadata staging step.

schema_version = 1
id = "android-a"

# The managed ROM number comes only from the bdsvars Slot-<id> record via
# efivarfs. Values 1..=5 are valid; missing/invalid records fail managed boot.
# Secondary ROMs may declare firmware_views and writable ESP-file backends.

# managed = true requires successful gpt.ko projection of the complete list
# below before Android handoff, with no stock-ROM fallback. managed = false
# requires the partitions array to be empty or absent and must not list a gpt
# module in the manifest.
managed = true

# Order is publication order, not priority or fallback. Names are unique at the
# Android partition surface, must not collide with a retained physical name or
# another projection, and are limited to 36 bytes: the gpt ABI label size.
#
# Backends are resolved only when the ordered payload reaches the `gpt` entry,
# after every earlier module and its scripts have run, so a logical volume,
# mapper device, loop or ESP file those entries activate is visible. Each
# `backend` is one of five documented forms:
#
#   /dev/block/by-name/<physical-name>  exact, unique sysfs PARTNAME
#   /dev/mapper/<name>                  exact, unique /sys/class/block/dm-*/dm/name
#   /dev/loopN                          an existing loop device
#   esp-file:<relative-path>            preallocated regular file on the
#                                       mounted ESP, attached by the loader
#                                       with zero offset and no size limit and
#                                       the access this entry requests:
#                                       read-only for every ROM, and writable
#                                       only for a managed ROM >= 2 whose OTA
#                                       rewrites its own preallocated image
#                                       (the loader then holds the ESP
#                                       read-write for that boot)
#   rom-image:<base>                    one of the ROM's own kernel-image roles
#                                       on the ESP, base-named (see the ROM >= 2
#                                       section at the end of this file)
#
# What an earlier module may do first, e.g. activate a thick or thin LV with
# `dmsetup`, is a module/script concern; the projection that follows only ever
# names the resulting block device. Each projection spans the entire backend;
# whole-LU devices, offsets, size slicing, and any extent/FIEMAP ABI are not
# accepted. The ESP-file relative path is resolved from the ESP mount root,
# e.g. esp-file:esu/backing.img, and the attachment stays alive through the
# projection. `read_only` explicitly selects projected access. A physical
# partition with the same name is hidden and forced read-only; unrelated
# stock partitions retain their native visibility and access mode.

[[partitions]]
name = "super"
backend = "/dev/block/by-name/super_1"
read_only = false

[[partitions]]
name = "vbmeta_system"
backend = "/dev/block/by-name/vbmeta_system_1"
read_only = true

# A logical volume activated by an earlier ordered module or script.
[[partitions]]
name = "system"
backend = "/dev/mapper/lv-system"
read_only = true

# A preallocated image on the read-only ESP; only the read-only ESP-file form
# and `read_only = true` are accepted.
[[partitions]]
name = "vendor"
backend = "esp-file:esu/backing/vendor.img"
read_only = true

# Each ROM projects its own metadata view. A multi-ROM payload also projects
# the shared physical credential store under metadata_shared below.
[[partitions]]
name = "metadata"
backend = "/dev/mapper/rom-metadata_1"
read_only = false

# Every managed multi-ROM payload also projects the physical metadata partition
# under a private name: the daemon mounts it at /metadata/shared and binds its
# `password_slots` directory over /metadata/password_slots, so all ROMs share
# one AOSP-managed slot map whose entries stay per-ROM (owner `host` for ROM 1,
# `gsi<N>` for ROM N). Legal next to the ROM's own metadata view: the
# duplicate-backend rule is per resolved device, and a partition may be a
# backend of more than one projection. A single-ROM payload omits this entry.
[[partitions]]
name = "metadata_shared"
backend = "/dev/block/by-name/metadata"
read_only = false

# Normal boot HAL persistence: both are projected, never whole-LU access.
[[partitions]]
name = "bdsvars"
backend = "/dev/block/by-name/bdsvars"
read_only = false

[[partitions]]
name = "misc"
backend = "/dev/block/by-name/misc"
read_only = false

# ---------------------------------------------------------------------------
# Per-ROM firmware views (managed ROM >= 2 only)
#
# These entries belong to a ROM file whose `rom_number` is 2..=5: a ROM 1 or
# unmanaged file must not contain `firmware_views` at all, and validation
# rejects it there. They are the only part of this catalogue that is not
# interchangeable between ROM numbers.
#
# A ROM >= 2 must not write the shared physical firmware partitions while still
# being able to "flash" firmware in an OTA. Every entry below names one physical
# `<base>_a`/`<base>_b` PARTNAME and gets a thin device of the shared pool with
# that partition as its external origin: unwritten blocks read the physical
# bytes, this ROM's writes provision private blocks, and the pool is the shared
# scratch space. The `thin` module activates the pool, then the `fw-views`
# module (listed between `thin` and `gpt`) creates these devices and the `gpt`
# entry projects them.
#
# Rules enforced by the loader:
#   * only with `rom_number >= 2`, and only on a managed ROM;
#   * `name` must be a `<base>_a`/`<base>_b` PARTNAME whose base is not one the
#     kernel selects from the current slot (boot, init_boot, vendor_boot, dtbo,
#     vbmeta, vbmeta_system, vbmeta_vendor), and must be unique;
#   * `thin_id` must be `(rom_number << 16) | index`, with the 1-based position
#     of the entry in this list, so ids are deterministic, belong to this ROM
#     alone, and can never collide with an LVM2-owned id below 0x10000;
#   * every view must also appear as a writable projection with the exact
#     backend `/dev/mapper/rom<N>-fw-<name>`.
#
# Authoring rule for the phone: one view per physical `<base>_a`/`<base>_b` pair
# on LU0-LU5 except the seven kernel-set bases and `super`, plus `super_N`,
# `metadata`, `userdata`, `metadata_shared`, `bdsvars`, `misc` and the 14
# kernel-set `esp-file:` projections; about 103 projections, within the
# 128-projection gpt ABI.

[[firmware_views]]
name = "xbl_a"
thin_id = 131073

[[partitions]]
name = "xbl_a"
backend = "/dev/mapper/rom2-fw-xbl_a"
read_only = false

# ---------------------------------------------------------------------------
# Kernel-image roles (managed ROM >= 2 only)
#
# A managed ROM >= 2 does not boot the physical `<base>_a`/`<base>_b` kernel
# partitions. The operator chooses any non-empty subset of the ordered image
# bases (boot, init_boot, vendor_boot, vendor_kernel_boot, dtb, dtbo, pvmfw,
# vbmeta, vbmeta_system, vbmeta_vendor), and the ROM declares both letters of
# each chosen base with the base-named `rom-image:` backend and
# `read_only = false`. Both letters of a base are served by the same ESP file,
# `rom/<id>/<base>.img`, which rom-bootgen preallocates.
#
# While no update is staged, the loader resolves a base's non-booted letter to
# the ROM's per-base switch device `rom<N>-ota-<base>` — which the `ota` module
# publishes at PID 1 as an error target of the image's exact size — so an
# updater's writes reach the staging set instead of the running image. While a
# staged letter runs, that letter's partitions resolve to the staging LV. Both
# letters of a base must be present, both must carry the matching base, and
# neither may be read-only.

[[partitions]]
name = "boot_a"
backend = "rom-image:boot"
read_only = false

[[partitions]]
name = "boot_b"
backend = "rom-image:boot"
read_only = false

[[partitions]]
name = "vendor_boot_a"
backend = "rom-image:vendor_boot"
read_only = false

[[partitions]]
name = "vendor_boot_b"
backend = "rom-image:vendor_boot"
read_only = false
