# Deployed at /debug_ramdisk/esp/esu/manifest.toml during PID1, /dev/esp/esu later.
# Unknown fields are rejected: generation, [platform] and recovery_packages
# are not part of this schema. Build identity is diagnostic esu/build-id text,
# 12 lowercase hexadecimal bytes plus LF, mirrored by cpio /esu-build-id.
schema_version = 1
# BootedRom in efivarfs selects <id>.toml; Slot-<id> supplies ROM number 1..=5.
rom = "roms"
# ESP KernelSU modules, in precedence/script order. Each directory requires
# module.prop with matching id. PID1 runs pid1.sh (pid1-recovery.sh in recovery,
# only with recovery-ok); Android runs early.sh and the usual lifecycle scripts.
# initrc/*.rc is concatenated in this order, filenames sorted, <=65536 bytes.
modules_order = ["boot-hal", "thin", "fw-views"]

# Kernel images live ONLY in cpio /lib, never on the ESP. name/path/params are
# required. Core and efivarfs load first to resolve identity before scripts.
# Remaining kernel modules initialize before PID1 helpers; GPT resolves and
# publishes projections after the helpers have created their backend devices.
[[modules]]
name = "kernelesp"
path = "lib/kernelesp.ko"
params = ""

[[modules]]
name = "thin"
path = "lib/thin.ko"
params = ""

[[modules]]
name = "gpt"
path = "lib/gpt.ko"
params = ""

[[modules]]
name = "efivarfs"
path = "lib/efivarfs.ko"
params = "dev=by-name:bdsvars"
