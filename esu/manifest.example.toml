# Deployed at /debug_ramdisk/esp/esu/manifest.toml during PID1, /dev/esp/esu later.
# Unknown fields are rejected: generation, [platform] and recovery_packages
# are not part of this schema. Build identity is diagnostic esu/build-id text,
# 12 lowercase hexadecimal bytes plus LF, mirrored by cpio /esu-build-id.
schema_version = 1
# BootedRom in efivarfs selects <id>.toml; Slot-<id> supplies ROM number 1..=5.
rom = "roms"
# ESP KernelSU modules, in precedence/script order. Each directory requires
# module.prop with matching id. PID1 runs pid1.sh (pid1-recovery.sh in recovery,
# only with recovery-ok); Android runs early.sh and the usual lifecycle scripts.
# initrc/*.rc is concatenated in this order, filenames sorted, <=65536 bytes.
# Modules are optional by default; a regular `critical` marker opts in to
# fatal PID1/normal-Android errors. Recovery after init reports and continues.
# Shipped thin/ota/fw-views are critical; boot-hal/avb-graft are optional.
# `ota` publishes the per-base switch devices every `rom-image:` kernel-image
# role resolves to (required for a managed ROM >= 2) and must follow `thin`,
# which activates the staging LVs behind them.
# disable/remove skip a module; skip_mount skips only its overlays.
# This example includes boot-hal; omit that id when no HAL module is supplied.
modules_order = ["boot-hal", "thin", "ota", "fw-views", "avb-graft"]

# Kernel images live ONLY in cpio /lib, never on the ESP. name/path/params are
# required. Core, efivarfs frontend and EFVS backend load before identity/scripts.
# Remaining kernel modules initialize before PID1 helpers; GPT resolves and
# publishes projections after the helpers have created their backend devices.
# `by-name:<partition>` parameters resolve the unique sysfs PARTNAME/dev_t.
# PID1 never requires Android's later /dev/block/by-name symlinks for this.
[[modules]]
name = "kernelesp"
path = "lib/kernelesp.ko"
params = ""

[[modules]]
name = "thin"
path = "lib/thin.ko"
params = ""

[[modules]]
name = "gpt"
path = "lib/gpt.ko"
params = ""

[[modules]]
name = "efivarfs"
path = "lib/efivarfs.ko"
params = ""

[[modules]]
name = "efivar_store"
path = "lib/efivar_store.ko"
params = "dev=by-name:bdsvars"
