[package]
name = "egyskinit"
version = "2.0.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
egysk-runtime = { path = "../egysk-runtime" }
libc = "0.2"

# for elf parsing
goblin = "0.10"
scroll = "0.13"

anyhow.workspace = true
rustix = { git = "https://github.com/KernelSU2/rustix.git", rev = "4a53fbc", features = ["mount", "fs", "runtime", "system", "process"] }


# for kmsg logging
log.workspace = true
