[package]
name = "ota-core"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-only"
description = "Shared OTA primitives: staging names, base-image copy, KMI/ARB probes, ABL efisp check and the takeover overlay"

[dependencies]
abl-image = { path = "../abl-image" }
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }
anyhow.workspace = true
dm = { path = "../dm" }
esu-platform = { path = "../esu-platform" }
lz4 = "1.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
