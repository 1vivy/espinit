[package]
name = "esud"
version = "0.1.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "esud"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }
esuinit = { path = "../esuinit" }
goblin = "0.10"
libc.workspace = true
lz4 = "1.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[dependencies]
esu-platform = { path = "../esu-platform" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log.workspace = true
rust-embed = { version = "8", features = [
    "debug-embed",
    "compression", # must clean build after updating binaries
] }
which = "8"
regex-lite = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", features = [
    "all-apis",
] }
android_logger = { version = "0.15", default-features = false }
zip = { version = "8",  features = [
    "deflate",
    "deflate64",
    "time",
    "lzma",
    "xz",
], default-features = false }
zip-extensions = { version = "0.14", features = [
    "deflate",
    "lzma",
    "xz",
], default-features = false }
java-properties = { git = "https://github.com/KernelSU2/java-properties.git", branch = "master", default-features = false }
serde_json = "1"
encoding_rs = "0.8"
humansize = "2"
libc = "0.2"
extattr = "1"
jwalk = "0.9"
is_executable = "1"
nom = "8"
derive-new = "0.7"
getopts = "0.2"
esuinit = { path = "../esuinit" }
prop-rs-android = { git = "https://github.com/KernelSU2/ksu_props", rev = "ddb6ee7294467f7f25bad2118e9e24eee104144b" }

[build-dependencies]
bindgen = "0.72"
